services:
  agent:
    image: ai-agent-img:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-agent
    restart: unless-stopped
    ports:
      - "8587:8587"
      - "5005:5005"
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    depends_on:
      - n8n
    volumes:
      - "C:/agents/temp_files:/home/temp_files"
    networks:
      - agent-network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin
      N8N_RESTRICT_FILE_ACCESS_TO: /home/temp_files
      ## enable execute command component
      NODES_EXCLUDE: "[]"
      ##
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/

    volumes:
      - "C:/agents/temp_files:/home/temp_files"
      - aitest01_n8n_data:/home/node/.n8n

    networks:
      - agent-network

volumes:
  aitest01_n8n_data:
    external: true

networks:
  agent-network: