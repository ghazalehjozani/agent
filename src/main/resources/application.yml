app:
  workspace:
    root-path: /home/temp_files/ai-agent
    architecture-result-md-file: /home/temp_files/architectural-result-map-rules.md
    path: /home/temp_files/

  report:
    is-json: true

  project:
    id: ${random.uuid}

  rule-extraction:
    max-chunk-chars: 3000

## batching configurations

  batching:
    strategy: adaptive
    max-input-tokens: 29000
    max-files: 15
    max-rules: 10
    max-segments: 15
    max-segments-per-file: 3
    min-rule-overlap: 0.25

## OpenTelemetry

otel:

  service:
    name: architecture-compliance-agent

  resource:
    attributes:
      deployment.environment: docker

  exporter:

    otlp:

      # Spring Boot داخل Docker است.
      # بنابراین از Docker DNS استفاده می‌کنیم.
      endpoint: http://otel-collector:4318

      protocol: http/protobuf

  traces:
    sampler: always_on