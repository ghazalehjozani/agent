server:
  port: 8587
  error:
    whitelabel:
      enabled: false

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/agent-db
    username: agent
    password: agent
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

  endpoint:
    health:
      show-components: always
      show-details: always

